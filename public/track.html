<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Le jeton de suivi est dans l'URL : on évite qu'il fuite via le Referer et l'indexation. -->
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <title>Suivi de course - TuniDrive</title>
  <style>
    :root { --ink: #0b0b0c; --mint: #bfe8dc; --mint-deep: #0b5d4b; --muted: #9ca3af; --line: #26272a; }
    html, body { height: 100%; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Fira Sans', 'Droid Sans', 'Helvetica Neue', Arial, sans-serif; background: var(--ink); color: #fff; }
    #map { position: absolute; inset: 0; }

    #topbar { position: fixed; top: 0; left: 0; right: 0; z-index: 1000; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; padding-top: max(12px, env(safe-area-inset-top)); pointer-events: none; }
    .brand { pointer-events: auto; font-weight: 800; letter-spacing: 0.2px; font-size: 14px; background: rgba(11,11,12,0.88); border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; backdrop-filter: blur(8px); }
    #status { pointer-events: auto; font-size: 12px; font-weight: 700; padding: 8px 12px; border-radius: 999px; background: rgba(11,11,12,0.88); border: 1px solid var(--line); color: var(--muted); backdrop-filter: blur(8px); }
    #status.live { color: var(--mint); border-color: #1f4d40; }
    #status.warn { color: #fcd34d; border-color: #5b4a12; }
    #status.end  { color: #fca5a5; border-color: #5b1f1f; }

    #panel { position: fixed; left: 0; right: 0; bottom: 0; z-index: 1000; background: var(--ink); border-top: 1px solid var(--line); border-radius: 22px 22px 0 0; padding: 16px 20px; padding-bottom: max(18px, env(safe-area-inset-bottom)); display: flex; align-items: center; gap: 14px; }
    #eta { flex: 1; min-width: 0; }
    #etaValue { font-size: 34px; line-height: 38px; font-weight: 800; letter-spacing: -0.8px; }
    #etaUnit { font-size: 14px; font-weight: 700; color: var(--muted); margin-left: 4px; }
    #etaSub { font-size: 13px; color: #d1d5db; margin-top: 2px; }
    #distance { display: none; align-items: center; background: var(--mint); color: var(--mint-deep); font-weight: 800; font-size: 13px; padding: 7px 12px; border-radius: 999px; white-space: nowrap; }
    #recenter { position: fixed; right: 16px; bottom: 120px; z-index: 1000; width: 44px; height: 44px; border-radius: 22px; border: 1px solid var(--line); background: #fff; color: var(--ink); font-size: 20px; display: none; align-items: center; justify-content: center; cursor: pointer; }

    #message { position: fixed; inset: 0; z-index: 1500; display: none; align-items: center; justify-content: center; text-align: center; padding: 28px; font-size: 16px; line-height: 1.5; color: #d1d5db; background: var(--ink); }
  </style>
</head>
<body>
  <div id="map"></div>

  <div id="topbar">
    <div class="brand">TuniDrive</div>
    <div id="status" role="status" aria-live="polite">Initialisation…</div>
  </div>

  <button id="recenter" type="button" aria-label="Recentrer la carte">◎</button>

  <div id="panel">
    <div id="eta">
      <div><span id="etaValue">—</span><span id="etaUnit">min</span></div>
      <div id="etaSub">Localisation du chauffeur…</div>
    </div>
    <div id="distance"></div>
  </div>

  <div id="message"></div>

  <script src="./track-config.js"></script>
  <script src="./vendor/supabase-js-2.57.0.umd.js"></script>
  <script src="./track.js"></script>
</body>
</html>
