<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Le lien contient des jetons de récupération : pas de Referer, pas d'indexation. -->
    <meta name="referrer" content="no-referrer">
    <meta name="robots" content="noindex, nofollow">
    <title>Réinitialisation de mot de passe - TuniDrive</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #003333 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 16px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
        }
        
        .logo {
            font-size: 32px;
            font-weight: bold;
            color: #000000;
            margin-bottom: 20px;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #003333;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .message {
            color: #333;
            font-size: 16px;
            margin-top: 20px;
            line-height: 1.6;
        }
        
        .error {
            color: #e74c3c;
            margin-top: 20px;
            padding: 15px;
            background: #fee;
            border-radius: 8px;
            border: 1px solid #e74c3c;
        }
        
        .button {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 24px;
            background: #003333;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            border: none;
            cursor: pointer;
        }

        .button:hover {
            background: #004d4d;
        }
    </style>
</head>
<body>
    <div class="container">
        
		<div class="logo">TuniDrive</div>
		<div class="spinner" id="spinner"></div>
		<div class="message" id="message">Préparation du formulaire de réinitialisation...</div>
        <div id="error" class="error" style="display: none;"></div>

		<!-- Formulaire de réinitialisation (affiché quand la session recovery est prête) -->
		<form id="form" style="display: none; margin-top: 16px; text-align: left;">
			<label style="font-weight: 600;">Nouveau mot de passe</label>
			<input id="pwd" type="password" placeholder="Nouveau mot de passe" required
				style="display:block;width:100%;padding:12px;margin-top:8px;border:1px solid #ddd;border-radius:8px;" />

			<label style="font-weight: 600;margin-top:12px;display:block;">Confirmer le mot de passe</label>
			<input id="pwd2" type="password" placeholder="Confirmer le mot de passe" required
				style="display:block;width:100%;padding:12px;margin-top:8px;border:1px solid #ddd;border-radius:8px;" />

			<button type="submit" class="button" style="width:100%;margin-top:16px;">Mettre à jour le mot de passe</button>
		</form>

		<!-- Message succès -->
		<div id="success" class="message" style="display:none;margin-top:16px;">
			✅ Votre mot de passe a été réinitialisé avec succès. Vous pouvez maintenant ouvrir l'application TuniDrive et vous connecter avec votre nouveau mot de passe.
		</div>
    </div>

	<script src="./vendor/supabase-js-2.57.0.umd.js"></script>
	<script src="./reset-password.js"></script>
</body>
</html>
